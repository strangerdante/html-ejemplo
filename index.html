<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página de ejemplo</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:active {
      transform: scale(0.98);
    }

    button.secundario {
      background: #e2e8f0;
      color: #1e293b;
    }

    button.secundario:hover {
      background: #cbd5e1;
    }

    .acciones {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #contador {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hola, mundo</h1>
    <p>Esta es una página HTML sencilla de ejemplo con estilos básicos y un poco de interactividad.</p>
    <div class="acciones">
      <button id="btn">Haz clic aquí</button>
      <button id="btn-reset" class="secundario">Reiniciar</button>
    </div>
    <span id="contador">Clics: 0</span>
  </main>

  <script>
    let clics = 0;
    const boton = document.getElementById("btn");
    const botonReset = document.getElementById("btn-reset");
    const contador = document.getElementById("contador");

    function pintarContador() {
      contador.textContent = `Clics: ${clics}`;
    }

    boton.addEventListener("click", () => {
      clics += 1;
      pintarContador();
    });

    botonReset.addEventListener("click", () => {
      clics = 0;
      pintarContador();
    });
  </script>
</body>
</html>
